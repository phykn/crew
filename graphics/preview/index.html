<!doctype html>
<meta charset="utf-8" />
<title>camp props</title>
<style>
  body { background: #263021; margin: 0; padding: 16px; display: flex; flex-wrap: wrap; gap: 16px; font: 12px sans-serif; color: #c9c2ad; }
  figure { margin: 0; display: grid; gap: 4px; justify-items: center; }
  a { color: inherit; }
</style>
<script type="module">
  // Each prop is painted where the camp places it, by the app's own code, so the fire lights it as it will in the app
  import { iso } from '../../src/frontend/camp/projection.js';
  import { PROPS, TORCHES, WILDS } from '../../src/frontend/camp/layout.js';
  import { drawProp } from '../../src/frontend/camp/art/props.js';

  const q = new URLSearchParams(location.search),
    pick = q.get('kind'),
    k = +(q.get('zoom') ?? (pick ? 10 : 4));
  // One of each kind, or every one of the kind asked for
  const all = [...PROPS, ...TORCHES.map((t) => ({ ...t, kind: 'torch' })), ...WILDS],
    shown = pick ? all.filter((d) => d.kind === pick) : all.filter((d, i) => all.findIndex((e) => e.kind === d.kind) === i);
  for (const d of shown) {
    const fig = document.createElement('figure'),
      c = document.createElement('canvas'),
      p = iso(d.x + (d.w ?? 0) / 2, d.y + (d.h ?? 0) / 2);
    c.width = 90 * k;
    c.height = 75 * k;
    const ctx = c.getContext('2d');
    ctx.setTransform(k, 0, 0, k, (-p.x + 45) * k, (-p.y + 50) * k);
    drawProp(ctx, d);
    fig.append(c, Object.assign(document.createElement('a'), { href: `?kind=${d.kind}`, textContent: d.kind }));
    document.body.append(fig);
  }
  document.title = 'ready';
</script>
